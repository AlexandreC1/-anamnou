services:
  - type: web
    name: anamnou-api
    runtime: docker
    plan: free
    region: virginia
    branch: feat/phase-3-yearbook
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /ready
    dockerCommand: sh -c 'npm run db:migrate && node apps/api/dist/main.js'
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: '4000'
      - key: PUBLIC_WEB_URL
        value: https://anamnou-preview.pages.dev
      - key: MAIL_TRANSPORT
        value: resend
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
